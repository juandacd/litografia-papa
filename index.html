<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Litografía</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- PANTALLA 1: INICIO -->
  <div id="pantalla-inicio" class="pantalla activa">
    <div class="header">
      <h1>📋 Litografía</h1>
      <p class="subtitulo">Órdenes de trabajo</p>
    </div>
    <button class="btn-principal" onclick="mostrarPantalla('pantalla-nueva-orden')">
      + Nueva Cotización
    </button>
    <div id="lista-ordenes" class="lista-ordenes">
      <p class="cargando">Cargando órdenes...</p>
    </div>
  </div>

  <!-- PANTALLA 2: NUEVA COTIZACIÓN -->
  <div id="pantalla-nueva-orden" class="pantalla">
    <div class="header">
      <button class="btn-volver" onclick="mostrarPantalla('pantalla-inicio')">← Volver</button>
      <h2>Nueva Cotización</h2>
    </div>

    <div class="formulario">
      <label>Cliente</label>
      <input type="text" id="cliente" placeholder="Nombre del cliente" />

      <label>Descripción del pedido</label>
      <input type="text" id="descripcion" placeholder="Ej: 1000 volantes carta" />

      <label>Fecha de entrega</label>
      <input type="date" id="fecha-entrega" />

      <h3>💰 Costos por componente</h3>
      <div id="componentes-lista">
        <!-- Se genera con JavaScript -->
      </div>

      <h3>⚙️ Porcentajes</h3>
      <div class="fila-porcentaje">
        <label>Costos indirectos (%)</label>
        <input type="number" id="pct-indirectos" value="12" min="0" max="100" onchange="calcularTotal()" />
      </div>
      <div class="fila-porcentaje">
        <label>Margen de ganancia (%)</label>
        <input type="number" id="pct-margen" value="30" min="0" max="100" onchange="calcularTotal()" />
      </div>
      <div class="fila-porcentaje">
        <label>Aplicar Retefuente</label>
        <input type="checkbox" id="aplica-rete" onchange="calcularTotal()" />
      </div>
      <div class="fila-porcentaje" id="fila-rete" style="display:none">
        <label>Retefuente (%)</label>
        <input type="number" id="pct-rete" value="6" min="0" max="100" onchange="calcularTotal()" />
      </div>

      <div class="resumen-cotizacion">
        <div class="fila-resumen"><span>Costo base:</span><span id="res-costo-base">$0</span></div>
        <div class="fila-resumen"><span>+ Indirectos:</span><span id="res-indirectos">$0</span></div>
        <div class="fila-resumen"><span>+ Margen:</span><span id="res-margen">$0</span></div>
        <div class="fila-resumen" id="fila-res-rete" style="display:none"><span>+ Retefuente:</span><span id="res-rete">$0</span></div>
        <div class="fila-resumen total"><span>PRECIO A COBRAR:</span><span id="res-total">$0</span></div>
      </div>

      <button class="btn-principal" onclick="guardarCotizacion()">💾 Guardar Cotización</button>
    </div>
  </div>

  <!-- PANTALLA 3: DETALLE DE ORDEN -->
  <div id="pantalla-detalle" class="pantalla">
    <div class="header">
      <button class="btn-volver" onclick="mostrarPantalla('pantalla-inicio')">← Volver</button>
      <h2 id="detalle-titulo">Orden #</h2>
    </div>
    <div id="detalle-contenido" class="formulario"></div>
  </div>

  <!-- PANTALLA 4: REGISTRAR GASTOS REALES -->
  <div id="pantalla-gastos" class="pantalla">
    <div class="header">
      <button class="btn-volver" onclick="volverADetalle()">← Volver</button>
      <h2>Gastos Reales</h2>
    </div>
    <div class="formulario">
      <p id="gastos-orden-info" class="subtitulo"></p>

      <label>¿Cuánto pagó el cliente? ($)</label>
      <input type="number" id="cobrado-real" placeholder="0" />

      <h3>💸 Gastos por componente</h3>
      <div id="gastos-lista"></div>

      <div class="resumen-cotizacion">
        <div class="fila-resumen"><span>Total gastado:</span><span id="gasto-total">$0</span></div>
      </div>

      <button class="btn-principal" onclick="guardarGastos()">💾 Guardar Gastos</button>
    </div>
  </div>

  <!-- PANTALLA 5: ANÁLISIS -->
  <div id="pantalla-analisis" class="pantalla">
    <div class="header">
      <button class="btn-volver" onclick="volverADetalle()">← Volver</button>
      <h2>📊 Análisis de Orden</h2>
    </div>
    <div id="analisis-contenido" class="formulario"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
